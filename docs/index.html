const state = JSON.parse(localStorage.getItem('lookx_state') || '{}');

function isDmd(username) { return !!state[username]; }
function toggleDmd(username) {
  if (state[username]) delete state[username];
  else state[username] = Date.now();
  localStorage.setItem('lookx_state', JSON.stringify(state));
  render();
}

let currentFilter = 'all';
let searchQuery = '';

function render() {
  const container = document.getElementById('cards');
  let items = [...DATA];

  if (currentFilter === 'pending') items = items.filter(p => !isDmd(p.username));
  else if (currentFilter === 'done') items = items.filter(p => isDmd(p.username));
  else if (currentFilter === 'leads') items = items.filter(p => p.leads_rounds);
  else if (currentFilter !== 'all') items = items.filter(p => p.tier === currentFilter);

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    items = items.filter(p =>
      p.name.toLowerCase().includes(q) ||
      p.username.toLowerCase().includes(q) ||
      p.firm.toLowerCase().includes(q)
    );
  }

  // Sort: not-DM'd first, then by followers ascending (lowest first)
  items.sort((a, b) => {
    const aDmd = isDmd(a.username) ? 1 : 0;
    const bDmd = isDmd(b.username) ? 1 : 0;
    if (aDmd !== bDmd) return aDmd - bDmd;
    return (a.followers || 999999) - (b.followers || 999999);
  });

  container.innerHTML = items.map(p => {
    const dmd = isDmd(p.username);
    const followers = p.followers ? p.followers.toLocaleString() : '?';
    const refIcon = p.ref_type === 'tweet' ? '𝕏' : p.ref_type === 'article' ? '📝' : '👤';
    const refLabel = p.ref_type === 'tweet' ? 'View tweet' : p.ref_type === 'article' ? 'View article' : 'View profile';
    return `
      <div class="card ${dmd ? 'dmd' : ''}" id="card-${p.username}">
        <div class="card-header">
          <div>
            <span class="card-name">${esc(p.name)}</span>
            <a class="card-handle" href="${p.profile_url}" target="_blank" rel="noopener">@${esc(p.username)}</a>
          </div>
          <span class="badge badge-${p.tier}">${p.tier}</span>
        </div>
        <div class="card-meta">
          <span class="card-firm">${esc(p.firm)} — ${esc(p.role || '')}</span>
          <span class="card-followers">${followers} followers</span>
        </div>
        <div class="card-meta" style="margin-top:6px">
          ${p.aum ? `<span class="card-aum">💰 ${esc(p.aum)} AUM</span>` : ''}
          ${p.leads_rounds ? `<span class="badge-leads">⚡ Leads Rounds</span>` : ''}
        </div>
        ${p.portfolio ? `<div class="card-portfolio"><span class="card-portfolio-label">Portfolio</span><span class="card-portfolio-items">${esc(p.portfolio)}</span></div>` : ''}
        <div class="card-evidence">${esc(p.evidence)}</div>
        <div class="card-ref">
          <a href="${p.ref_url}" target="_blank" rel="noopener"><span class="ref-icon">${refIcon}</span> ${refLabel}</a>
          ${p.best_time ? `<span class="card-timing"><span class="card-timing-icon">⏰</span> Best time: ${esc(p.best_time)}</span>` : ''}
        </div>
        <div style="color:#555;font-size:12px;font-style:italic;margin-bottom:12px">${esc(p.tweet_ref)}</div>
        <div class="card-message">${esc(p.message)}</div>
        <div class="card-actions">
          <button class="btn btn-copy" onclick="copyMsg('${p.username}', this)">Copy Message</button>
          <button class="btn btn-dmd ${dmd ? 'done' : ''}" onclick="toggleDmd('${p.username}')">
            ${dmd ? 'Undo DM' : "Mark DM'd"}
          </button>
        </div>
      </div>`;
  }).join('');

  const dmdCount = DATA.filter(p => isDmd(p.username)).length;
  document.getElementById('dmd-count').textContent = dmdCount;
  document.getElementById('total-count').textContent = DATA.length;
  document.getElementById('hot-count').textContent = DATA.filter(p => p.tier === 'HOT').length;
  document.getElementById('warm-count').textContent = DATA.filter(p => p.tier === 'WARM').length;
  document.getElementById('luke-count').textContent = DATA.filter(p => p.tier === 'LUKEWARM').length;
}

function copyMsg(username, btn) {
  const p = DATA.find(d => d.username === username);
  if (!p) return;
  navigator.clipboard.writeText(p.message).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy Message'; btn.classList.remove('copied'); }, 2000);
  });
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

render();
</script>
</body>
</html>
